[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "font-file-parser"
version = "0.2.1"
description = "TTF font reader for exposing glyph data"
readme = "README.md"
authors = [{ name="Jack Morter", email="jackmorter11@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/Jackmorter11/font-file-parser.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]